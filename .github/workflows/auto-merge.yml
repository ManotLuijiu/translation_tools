name: Promote Develop to Version 16

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: promote-version-16
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  merge-to-version-16:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote the tested commit to version-16
        run: |
          git fetch origin develop version-16
          if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ]; then
            echo "A newer develop commit is in progress."
            exit 0
          fi
          git switch --detach origin/version-16
          git merge --ff-only "$GITHUB_SHA"
          git push origin HEAD:refs/heads/version-16
