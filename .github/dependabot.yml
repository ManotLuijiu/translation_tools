# Dependabot configuration for translation_tools
version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      - dependency-name: "frappe"
      - dependency-name: "erpnext"
      - dependency-name: "hrms"
      - dependency-name: "payments"

  # Root package.json (standard-version for releases)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/thai_translation_dashboard"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore"
